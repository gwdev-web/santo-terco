<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="canonical" href="{{url}}">
    <meta name="theme-color" content="#FAF8F5">
    <meta name="color-scheme" content="light">
    <script>
      /* Applies the saved prayer text size before the first paint (see src/js/components/text-size.js) */
      try {
        const size = JSON.parse(localStorage.getItem('santo-terco:text-size'));
        if (size === 'large' || size === 'x-large') document.documentElement.dataset.textSize = size;
      } catch {}
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Santo Terço">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="{{siteUrl}}og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Santo Terço: reze o terço do dia, oração por oração.">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;display=swap">
    <link rel="stylesheet" href="/src/styles/main.css">
