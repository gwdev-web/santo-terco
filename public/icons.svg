<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Icon sprite — 24px grid, 1.8px stroke, round caps, no fill.
    Usage: <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-home"></use></svg>
  -->
  <defs>
    <!-- Mysteries -->
    <symbol id="icon-joyful" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>
    </symbol>

    <symbol id="icon-sorrowful" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18M7.5 8h9"/>
    </symbol>

    <symbol id="icon-glorious" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.5"/>
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>
    </symbol>

    <symbol id="icon-luminous" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5c2.8 3 4.5 5.7 4.5 8.6a4.5 4.5 0 0 1-9 0c0-2.9 1.7-5.6 4.5-8.6z"/>
      <path d="M12 11.5c1 1.1 1.6 2 1.6 3a1.6 1.6 0 0 1-3.2 0c0-1 .6-1.9 1.6-3z"/>
    </symbol>

    <!-- Navigation -->
    <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10.5L12 4l8 6.5V20h-5v-5.5a3 3 0 0 0-6 0V20H4z"/>
    </symbol>

    <symbol id="icon-mysteries" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.5" r="4.5"/>
      <path d="M12 13v8M9 17.5h6"/>
    </symbol>

    <symbol id="icon-prayers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 5.5h5.5a3 3 0 0 1 3 3V19a2.5 2.5 0 0 0-2.5-2.5h-6z"/>
      <path d="M20.5 5.5H15a3 3 0 0 0-3 3V19a2.5 2.5 0 0 1 2.5-2.5h6z"/>
    </symbol>

    <symbol id="icon-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 20.5h17M6.5 20.5V11M10.5 20.5V5M14.5 20.5v-6M18.5 20.5V9"/>
    </symbol>

    <symbol id="icon-prayed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.5l4.5 4.5L19 7.5"/>
    </symbol>

    <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
      <path d="M3.5 10h17M8 3v4M16 3v4"/>
    </symbol>

    <!-- UI -->
    <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5.5v13l10.5-6.5z"/>
    </symbol>

    <!-- Brand: heart of beads + crucifix -->
    <symbol id="icon-logo" viewBox="0 0 32 44" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 27C9 21.5 3 17 3 10.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 2.5C29 17 23 21.5 16 27z" stroke-width="2.4" stroke-dasharray="0 3.4"/>
      <path d="M16 29v13M11.5 33.5h9" stroke-width="2"/>
    </symbol>

    <!-- Brand: Marian medallion -->
    <symbol id="icon-medallion" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="40" cy="40" r="37" stroke-width="2" stroke-dasharray="0 4.6"/>
      <circle cx="40" cy="40" r="30" stroke-width="1.5"/>
      <path d="M40 15v14M34.5 20h11" stroke-width="2.4"/>
      <path d="M26 58V33l14 18 14-18v25M22.5 58h7M50.5 58h7" stroke-width="3" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>
